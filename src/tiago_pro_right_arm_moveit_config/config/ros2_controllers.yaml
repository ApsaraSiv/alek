# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_right_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    gripper_right_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_right_controller:
  ros__parameters:
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_7_joint
      - arm_right_6_joint
    command_interfaces:
      []
    state_interfaces:
      []
gripper_right_controller:
  ros__parameters:
    joints:
      - gripper_right_finger_joint
      - gripper_right_finger_right_joint
    command_interfaces:
      []
    state_interfaces:
      []